name: CI and Production Deploy

# Hosted ubuntu-latest is blocked when account payment fails or Actions spend limit is $0
# (private repos). See docs/ci-billing.md.
# Self-hosted runner label marketing-ci is free of hosted-minute billing and keeps full checks.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate marketing site
    runs-on: [self-hosted, Windows, X64, marketing-ci]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Audit production dependencies
        shell: pwsh
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        shell: pwsh
        run: npm run typecheck

      - name: Build static export
        shell: pwsh
        run: npm run build:static

  deploy:
    name: Deploy production Worker
    runs-on: [self-hosted, Windows, X64, marketing-ci]
    timeout-minutes: 30
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Build static export
        shell: pwsh
        run: npm run build:static

      - name: Deploy to Cloudflare Workers
        shell: pwsh
        run: npx wrangler deploy --config wrangler.jsonc --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
