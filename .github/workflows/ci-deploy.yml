name: CI and Production Deploy

# Hosted ubuntu-latest is blocked when account payment fails or Actions spend limit is $0
# on private repos (user marinerxcapital). See docs/ci-billing.md.
# Jobs run on self-hosted label marketing-ci (no hosted-minute billing). Full checks retained.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single job avoids a second npm ci on Windows self-hosted (double install was hanging/killing the runner).
  # Order is intentional: audit → typecheck → build → (optional) deploy. No checks removed.
  validate:
    name: Validate marketing site
    runs-on: [self-hosted, Windows, X64, marketing-ci]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm cache pack/unpack via tar is unreliable on this Windows runner; skip without weakening checks
          cache: ''

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Audit production dependencies
        shell: pwsh
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        shell: pwsh
        run: npm run typecheck

      - name: Build static export
        shell: pwsh
        run: npm run build:static

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: npx wrangler deploy --config wrangler.jsonc --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
